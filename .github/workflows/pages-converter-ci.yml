name: pages-converter tests

on:
  push:
    paths: ["pages-converter/**", ".github/workflows/pages-converter-ci.yml"]
  pull_request:
    paths: ["pages-converter/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pages-converter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-draw
      - run: pip install -r requirements-dev.txt
      - run: pytest -q tests
